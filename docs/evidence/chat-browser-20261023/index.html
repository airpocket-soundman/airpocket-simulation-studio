<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation panel QA — synthetic provider</title><body style="margin:12px;font-family:sans-serif"><h1 style="font-size:18px">会話パネル検証・合成接続</h1><p>実AIへの接続ではありません。</p><button id="ja">日本語</button><button id="en">English</button><button id="ready">合成接続を準備</button><div id="panel"></div><script type="module">
import {createAgentChatPanel} from '/src/ui/agent-chat-panel.js';
let language='ja',resolvePrompt=null;const panel=createAgentChatPanel({host:document.getElementById('panel'),language:()=>language});for(const lang of ['ja','en'])document.getElementById(lang).onclick=()=>{language=lang;document.documentElement.lang=lang;document.dispatchEvent(new Event('studio-language'));};document.getElementById('ready').onclick=()=>panel.setProvider({describe:()=>({state:'ready'}),prompt:text=>new Promise(resolve=>{resolvePrompt=resolve;setTimeout(()=>{resolve({text:'合成応答 / Synthetic reply: '+text,cancelled:false});},8000);}),cancel:async()=>{resolvePrompt?.({text:'',cancelled:true});}});
</script></body></html>
