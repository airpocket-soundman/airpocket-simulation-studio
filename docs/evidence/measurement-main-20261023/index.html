<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>airpocket Simulation Studio</title><link rel="icon" href="/icons/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/icons/favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#050d1d"><script src="/coi-serviceworker.js"></script></head><body><div id="app"></div><script type="module" src="/src/main.js"></script><details style="position:fixed;bottom:4px;left:4px;z-index:99999;background:white;color:black;font-size:12px"><summary>Owned read-only QA</summary><button id="qa-load-model">Load owned synthetic project</button><button id="qa-project-snapshot">Capture project identity</button><textarea id="qa-project-json" aria-label="QA project identity"></textarea><output id="qa-lifecycle">initial</output></details><script type="module">addEventListener('pageshow',e=>{document.documentElement.dataset.qaPageshowPersisted=String(e.persisted);document.getElementById('qa-lifecycle').textContent='pageshow persisted='+e.persisted;});document.getElementById('qa-load-model').onclick=async()=>{await window.studioApi.loadProject(await(await fetch('/.qa/perf-idle-20261023/input.snapshot.json')).json());document.getElementById('qa-lifecycle').textContent='owned synthetic project loaded';};document.getElementById('qa-project-snapshot').onclick=async()=>{const project=window.studioApi.exportProject(),revision=await window.studioApi.getRevision();document.getElementById('qa-project-json').value=JSON.stringify({project,revision});};</script></body></html>
